# Non-secret settings. Secrets live in .env (development) or the process
# environment / SSM (production); see .env.example.

[logging]
level = "INFO"

# The Universe Rule (ADR 0005). Every key is part of the rule version recorded
# with each membership table, so changing one starts a new version.
[universe]
top_n = 200
lookback_trading_days = 126     # the trailing window before the month's first trading day
min_listing_trading_days = 126  # trading days of Listing Age
min_presence_percent = 90       # rows required on this share of the window's days
series = "EQ"                   # excludes SME (SM, ST) and trade-for-trade (BE, BZ)
excluded_isin_prefix = "INF"    # ETFs and other fund units trade in EQ with INF ISINs
# Rank each Instrument across its renames (ADR 0016), a new version that needs
# `rebuild-instruments` over the window first. "symbol" (the default when the
# key is left out, and then left out of the version) ranks each Symbol, the
# rule the #13 memberships were stored under.
rank_by = "instrument"
# Count Listing Age from the earliest NSE evidence, not the equity master's
# date (ADR 0017), a new version stored over the 120 months by #18.
# "listing_date" (the default when the key is left out) is the rule
# `ded30b1014c4` was stored under.
listing_age_from = "earliest_evidence"

[parity]
# Kite Parity (ADR 0018). A close mismatch: further than this fraction of the
# price (plus half a 5 paisa tick) from the end-of-day close, after Kite's own
# adjustment.
close_tolerance = 0.001
# The command fails at or above this percentage of the rows compared whose
# difference (missing, extra, or close) no Parity Reason explains.
max_unexplained_pct = 0.1
# The Trading Calendar, the file [integrity] checks against (the two must name
# the same file): a missing candle on one of its Special Sessions is explained.
trading_calendar = "trading_calendar.csv"

# RSS feeds for `ingest news`: a name for each feed and its URL. Items carried
# by more than one feed are stored once, under the first feed listed.
[news.feeds]
et_markets = "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
et_stocks = "https://economictimes.indiatimes.com/markets/stocks/rssfeeds/2146842.cms"
livemint_markets = "https://www.livemint.com/rss/markets"
moneycontrol_latest = "https://www.moneycontrol.com/rss/latestnews.xml"

[instruments]
# The checked-in manual Instrument Links: renames NSE's symbol-change list
# omits, each citing an official source (see the file's header).
manual_links = "manual_links.csv"

[corporate_actions]
# The checked-in splits and bonuses NSE's lists omit, each citing NSE's
# circulars (see the file's header); stored by `ingest cited-actions`.
cited = "cited_corporate_actions.csv"

[integrity]
# The checked-in Trading Calendar: the weekdays NSE was closed and the Special
# Sessions it held, each citing NSE's circular, and the dates it covers (see
# src/tradeline/trading_calendar.py).
trading_calendar = "trading_calendar.csv"
# The checked-in Large Move records: the reviewed reason and source of each
# Large Move no split or bonus explains (see src/tradeline/large_move_records.py).
large_moves = "large_moves.csv"
# A close more than this many times the previous close, either way, is a Large Move.
large_move_ratio = 1.5

# The Risk Engine's Limits (docs/risk-controls.md), fractions of Equity where
# they are. Every Plan of a Run is checked against them in Plan order.
[risk]
risk_per_trade = 0.01       # Equity at risk at the stop
max_open_positions = 8      # held Positions plus this Run's Passes
max_position = 0.15         # notional at entry
max_sector = 0.30           # NSE's sector; Unclassified counts as one
max_gross = 1.0             # no leverage, ever
participation_cap = 0.01    # of the 20-day average daily traded value
min_order_value = 5000      # rupees
max_new_entries = 4         # Passes per Run
min_reward_to_risk = 1.5    # after rounding to the tick
# The checked-in dated table of NSE tick sizes, each band citing NSE's circular
# (see the file's header).
tick_sizes = "tick_sizes.csv"

# The cost model (ADR 0003, docs/risk-controls.md): every Fill's charges and
# Slippage, itemised in the Ledger.
[costs]
# The checked-in dated rate schedule, each rate citing where it is published
# (see the file's header).
schedule = "cost_rates.csv"
# Real Zerodha contract notes the cost model is checked against; none yet.
contract_notes = "contract_notes.csv"
safety_margin = 0.0005      # Slippage per side, of the Order's value
impact = 0.1                # c x (Order value / 20-day average daily traded value)
