name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tradeline
          POSTGRES_PASSWORD: tradeline
          POSTGRES_DB: tradeline
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tradeline -d tradeline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TRADELINE_ENV: test
      TRADELINE_TEST_DATABASE_URL: postgresql://tradeline:tradeline@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tag is published past v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # pytest-socket (configured in pyproject) refuses every socket except
      # loopback, so the suite cannot reach the network even if a test tried.
      - run: uv run pytest

  # A frozen Protocol names its commit and a run under it is refused at any other, so every
  # tagged Protocol's commit stays an ancestor of main (ADR 0007, #85 amendment). Checked on
  # pull requests (against the merge result) and on main, not on other branches' pushes.
  protocol-tags:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Every protocol/* tag is an ancestor of this commit
        run: |
          missing=0
          for tag in $(git tag --list 'protocol/*'); do
            if ! git merge-base --is-ancestor "$tag" HEAD; then
              echo "::error::$tag ($(git rev-parse --short "$tag^{commit}")) is not an ancestor of HEAD"
              missing=1
            fi
          done
          exit $missing

