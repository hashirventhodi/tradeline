[project]
name = "tradeline"
version = "0.1.0"
description = "A long-only swing trading platform for NSE cash equities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[project.scripts]
tradeline = "tradeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No network in tests: only loopback sockets (the throwaway Postgres) are allowed.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost"

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["tradeline"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
